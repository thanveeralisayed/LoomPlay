name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test & Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [[ -z "$SDKMANAGER" && -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]]; then
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          elif [[ -z "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1)"
          fi
          if [[ -n "$SDKMANAGER" ]]; then
            echo "Using sdkmanager: ${SDKMANAGER}"
            set +o pipefail
            yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null
          else
            echo "::warning::sdkmanager not found under ${ANDROID_HOME}; relying on preinstalled SDK licenses."
          fi
          ls -la "${ANDROID_HOME}/licenses" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests & build debug APK
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: loomplay-debug-apks
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

